[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libero-pro"
version = "0.1.0"
description = "LIBERO-Pro simulation framework with Socket Server integration for remote policy evaluation"
license = { text = "MIT" }
authors = [
    { name = "Xueyang Zhou" },
    { name = "Yangming Xu" },
    { name = "Guiyao Tie" },
    { name = "Yongchao Chen" },
    { name = "Guowen Zhang" },
    { name = "Duanfeng Chu" },
    { name = "Pan Zhou" },
    { name = "Lichao Sun" },
    { name = "Bo Liu" },
    { name = "Yifeng Zhu" },
]
maintainers = [
    { name = "Lorenzo Mazza", email = "lorenzo.mazza@nct-dresden.de" },
    { name = "Ariel Rodriguez", email = "ariel.rodriguezjimenez@nct-dresden.de" },
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "hydra-core>=1.2.0",
    "numpy>=1.22.4",
    "wandb",
    "easydict",
    "transformers",
    "opencv-python",
    "robomimic>=0.2.0",
    "einops",
    "robosuite==1.4.1",
    "numba>=0.58.0",  
    "bddl",
    "matplotlib",
    "mujoco==2.3.7",
    "cloudpickle",
    "gym",
    "draccus",
    "imageio[ffmpeg]",
    "tqdm",
    "pyyaml",
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "torchvision==0.19.0",
    "tso-robotics-sockets",
    "versatil-constants>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
"lifelong.main" = "libero.lifelong.main:main"
"lifelong.eval" = "libero.lifelong.evaluate:main"
"libero.config_copy" = "scripts.config_copy:main"
"libero.create_template" = "scripts.create_template:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Tests with isolated collaborators",
    "integration: Tests using real files or components",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.hatch.build]
exclude = [
    "/libero/libero/assets/**",
    "!/libero/libero/assets/*.py",
    "/libero/libero/bddl_files/**",
    "/libero/libero/init_files/**",
    "/notebooks/custom_assets/**",
]

[tool.hatch.build.targets.wheel]
packages = ["libero", "scripts", "versatil_inference"]

[tool.hatch.build.targets.wheel.force-include]
"perturbation.py" = "perturbation.py"
"evaluation_config.yaml" = "evaluation_config.yaml"
"libero_ood" = "libero_ood"
"notebooks/generate_init_states.py" = "notebooks/generate_init_states.py"

[tool.hatch.build.targets.sdist]
include = [
    "libero/**",
    "scripts/**",
    "versatil_inference/**",
    "benchmark_scripts/**/*.py",
    "libero_ood/*.yaml",
    "notebooks/generate_init_states.py",
    "evaluation_config.yaml",
    "perturbation.py",
    "README.md",
    "NOTICE",
    "CHANGELOG.md",
    "tests/**",
]
